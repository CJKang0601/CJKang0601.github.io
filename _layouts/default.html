<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
    <div class="container">
        <div class="row" style="gap: 2rem;">
            <div class="col-12 col-md-4 mb-4 mb-md-0">
                <img src="{{ site.baseurl }}/assets/images/portrait_v2.jpg" alt="portrait of Cheng-Jun" class="img-fluid mb-3">
                <p class="title mb-2">Cheng-Jun Kang</p>
                <p class="contact-info">
                    {{ site.email | replace: "@", "[at]" }}<br>
                    <a class="important" href="{{ site.baseurl }}/assets/files/CV.pdf">résumé</a>,
                    <a class="important" href="https://github.com/{{ site.github_username }}">github</a>,
                    <a class="important" href="https://www.linkedin.com/in/cheng-jun-kang/">linkedin</a>
                </p>
            </div>
            <div class="col-12 col-md-8">
                {{ content }}
            </div>
        </div>
    </div>
</body>
</html>
