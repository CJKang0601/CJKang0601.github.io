<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/images/favicon-32x32.png">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
    <div class="container">
        <div class="row mb-md-4">
            <div class="col-12 col-md-4 mb-md-0" style="margin-bottom: 2rem;">
                <img src="{{ site.baseurl }}/assets/images/portrait.jpg" alt="portrait of Cheng-Jun" class="img-fluid">
            </div>
            <div class="d-none d-md-block col-md-8">
            </div>
        </div>
        <div class="row">
            <div class="col-12 col-md-4 mb-4 mb-md-0">
                <p class="title mb-3 mb-md-0">Cheng-Jun Kang</p>
                <p>
                    {{ site.email | replace: "@", "[at]" }}<br>
                    <a class="important" href="{{ site.baseurl }}/assets/files/CV.pdf">CV</a>,
                    <a class="important" href="https://github.com/{{ site.github_username }}">github</a>,
                    <a class="important" href="https://www.linkedin.com/in/cheng-jun-kang/">linkedin</a>
                </p>
            </div>
            <div class="col-12 col-md-8">
                {{ content }}
            </div>
        </div>
    </div>
</body>
</html>
