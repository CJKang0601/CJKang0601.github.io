<header class="site-header">
  <nav class="site-nav" aria-label="Primary navigation">
    <a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>about</a>
    <a href="{{ site.baseurl }}/publications/" {% if page.url contains "/publications" %}class="active"{% endif %}>publications</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Change theme" title="Change theme">
    <span class="theme-glyph theme-glyph-light" aria-hidden="true"></span>
    <span class="theme-glyph theme-glyph-dark" aria-hidden="true"></span>
  </button>
</header>
