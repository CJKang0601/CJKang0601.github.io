<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        color: #333;
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem;
      }
      .profile-container {
        display: flex;
        gap: 2rem;
        align-items: flex-start;
      }
      .profile-photo {
        flex-shrink: 0;
      }
      .profile-photo img {
        width: 200px;
        border-radius: 8px;
      }
      .profile-info {
        flex: 1;
      }
      .profile-info h1 {
        margin-top: 0;
      }
      .contact-links a {
        margin-right: 1rem;
        color: #0066cc;
        text-decoration: none;
      }
      .contact-links a:hover {
        text-decoration: underline;
      }
      @media (max-width: 600px) {
        .profile-container {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    {% include header.html %}
    <main>
      {{ content }}
    </main>
  </body>
</html>
